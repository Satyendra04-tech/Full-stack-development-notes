<!-- 
1. Use the provided HTML structure which includes four div elements, each assigned a unique class corresponding to the positioning technique to be applied.

2. Write all styles specific to this exercise in the style.css file.

3. Apply the following position properties to each div using the style.css:
        - Relative Div (relative-div): Set position to relative and move it 20px down and 20px to the right from its normal position.
        - Absolute Div (absolute-div): Set position to absolute and position it 30px from the top and 30px from the right of 
        its closest positioned ancestor.
        - Fixed Div (fixed-div): Set position to fixed and anchor it 10px from the bottom and 10px from the left of the viewport.
        - Sticky Div (sticky-div): Set position to sticky and specify it to stick 0px from the top of the viewport when you scroll.
-->

<!DOCTYPE html>
<html>
<head>
   
    <title>CSS Positioning Exercise</title>
    <link rel="stylesheet" href="./style3.css">
</head>
<body>
    <div class="relative-div">Relative Positioning</div>
    <div class="absolute-div">Absolute Positioning</div>
    <div class="fixed-div">Fixed Positioning</div>
    <div class="sticky-div">Sticky Positioning</div>
</body>
</html>
