<!-- 
1. Use the provided HTML structure which includes two main div containers, each containing a child div. Each pair will 
   demonstrate different z-index scenarios.

2. Write all styles specific to this exercise in the style.css file.

3. Apply positioning and z-index properties:
        - Parent Div (parent-low) with a Child Div (child-high):
                * Set the parent's position to relative and z-index to 1.
                * Position the child absolutely relative to the parent and set its z-index higher than the parent (e.g., 2) to make it appear above the parent.
        - Parent Div (parent-high) with a Child Div (child-low):
                * Set the parent's position to relative and z-index to 1.
                * Position both the child div's absolutely relative to the parent and set its z-index  of child-low to 2 and child-low-2 to 1 such that Child Low appears to be on top of Child Low 2
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS z-index Exercise</title>
    <link rel="stylesheet" href="/06-The-Box-Model/style3.css">
</head>
<body>
    <div class="parent-low">
        Parent Low
        <div class="child-high">Child High</div>
    </div>
    <div class="parent-high">
        Parent High
        <div class="child-low">Child Low 1</div>
        <div class="child-low-2">Child Low 2</div>
    </div>
    
</body>
</html>
