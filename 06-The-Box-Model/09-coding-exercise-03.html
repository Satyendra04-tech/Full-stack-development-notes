1. Use the provided HTML structure with two div elements, each with a unique class.

2. Write all your CSS in the style.css file.

3. Style each div based on its class:
        - Rounded Div (rounded-div):
                * Apply a specific border radius to each corner of the div:
                * border-top-left-radius of 20px.
                * border-top-right-radius of 30px.
                * border-bottom-right-radius of 40px.
                * border-bottom-left-radius of 50px.
                * Set a width and height of 200px for each div.
                * Apply a blue background color.

        - Shorthand Rounded Div (shorthand-rounded-div):
                * Use the shorthand border-radius property to set all corners to 25px.
                * Set a width and height of 200px.
                * Apply a green background color.
-->

<head>

    <div class="shorthand-rounded-div">Uniform Rounded Corners</div>
