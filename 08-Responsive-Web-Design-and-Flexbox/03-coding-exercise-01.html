<!-- 
1. Use the provided HTML structure which includes a div element with a class of responsive-box.

2. Write all your CSS in the style.css file.

3. Define media queries to adjust the background color of the div based on the following viewport conditions:
        - Mobile Devices: For screens narrower than 480px, set the background color to light blue.
        - Tablets in Portrait Mode: For screens between 481px and 1024px with portrait orientation, set the background color 
        to light green.
        - Tablets in Landscape Mode: For screens between 481px and 1024px with landscape orientation, set the background 
        color to light pink.
        - Desktops and Larger Screens: For screens wider than 1025px, set the background color to light gray. 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Media Queries Exercise</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="responsive-box">Resize your browser to see color changes.</div>
</body>
</html>
