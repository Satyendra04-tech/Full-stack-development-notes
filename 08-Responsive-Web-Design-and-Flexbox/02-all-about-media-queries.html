<!DOCTYPE html>
<html>
  <head>
    <title>Media Queries Examples</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>

/* Default styles */
body {
  font-family: Arial, sans-serif;
  background-color: lightgray;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
  font-size: 2rem;
}

p {
  font-size: 1.2rem;
  text-align: justify;
}

.box {
  background-color: white;
  border: 2px solid black;
  padding: 20px;
  margin: 10px 0;
}


/* Styles for small devices (e.g., mobile phones) */
@media (max-width: 480px) {
  body {background-color: lightpink;}

  h1 {font-size: 1.5rem;}

  p {font-size: 1rem;}

  .box {background-color: lightgreen;}
}

/* Styles for medium devices (e.g., tablets) in portrait mode*/
@media (min-width:481px) and (max-width:1024px) and (orientation:portrait){

  body {background-color: lightyellow;}

  h1 {font-size: 2rem;}

  p {font-size: 1.5rem;}

  .box{background-color: aqua;}
}

/* Styles for medium devices (e.g., tablets) in landscape mode */
@media (min-width:481px) and (max-width:1024px) and (orientation:landscape){

  body {background-color: blue;}

  h1 {font-size: 2rem;}

  p {font-size: 1.5rem;}

  .box {background-color: seagreen;}
}

/* Styles for large devices (e.g., desktops) */
@media (min-width:1025px){

  body {background-color: brown;}

  h1 {font-size: 2rem;}

  p {font-size: 1.5rem;}

  .box {background-color: aqua;}
}
    </style>
  </head>
  <body>
    <h1>Responsive with Media Queries</h1>
    <div class="box">
      <p>This is a responsive box.</p>
    </div>
  </body>
</html>
