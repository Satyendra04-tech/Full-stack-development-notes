<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Variables Lecture</title>

    <!-- THE BASIC STATEMENT DECLARATION IN JAVASCRIPT -->

    <!-- END WITH SEMICOLON  
      In JavaScript, semicolons are not strictly mandatory because of a feature called Automatic Semicolon Insertion (ASI). 
      Since the language adds them its better to use them  -->

    <script>

      /*
        Block Level comments in JavaScript
        Can contain multiple lines
       */
      // var allows redeclaration and reassignment

      var name;
      name = "John";
      name = "Alice";                     // Reassigning value
      console.log(name);


      //  Redeclaration within same scope is possible
      var name = "Mark";
      console.log(name);


      // let allows reassignment but not redeclaration in the same scope
      let _age = 25;
      _age = 30;                           // Reassigning value
      console.log(_age);


      // variables can contain digits as well
      let variable10 = 10;
      console.log(variable10)


      // Variable names are case sensitive
      // COUNTRY is different from country
      const COUNTRY = "USA";                     // we cannot change const value. If we try to reassign diffeent value to const, the console with show error.
      console.log(COUNTRY);

    </script>
    

</head>
