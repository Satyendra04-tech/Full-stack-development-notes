<!-- 
Complete the following tasks using the appropriate JavaScript arithmetic operators:
        - Addition: Add two numbers and store the result in a variable named sum.
        - Subtraction: Subtract one number from another and store the result in a variable named difference.
        - Multiplication: Multiply two numbers and store the result in a variable named product.
        - Division: Divide one number by another and store the result in a variable named quotient.
        - Modulus: Find the remainder of one number divided by another and store the result in a variable named remainder.
        - Exponential: Raise a number to the power of another number and store the result in a variable named power.
        - Increment: Increment a number and store the result in a variable named number.
        - Decrement: Decrement a number and store the result in a variable named decrementNumber. 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Operators Exercise</title>
    <script>
let sum = 5+3;

let difference = 10-2;

let product = 4*2;

let quotient = 20/5;

let remainder = 28%10;

let power = 2**3;

let number = 10;
number++;

let decrementNumber = 20;
decrementNumber--;
    </script>
</head>
<body>
    <h1>Arithmetic Operators Exercise</h1>
    <div>
        <p>Sum (5 + 3): <span id="outputSum"></span></p>
        <p>Difference (10 - 2): <span id="outputDifference"></span></p>
        <p>Product (4 * 2): <span id="outputProduct"></span></p>
        <p>Quotient (20 / 5): <span id="outputQuotient"></span></p>
        <p>Remainder (28 % 10): <span id="outputRemainder"></span></p>
        <p>Power (2 ^ 3): <span id="outputPower"></span></p>
        <p>Increment (10++): <span id="outputIncrement"></span></p>
        <p>Decrement (20--): <span id="outputDecrement"></span></p>
    </div>
    <script src="./coding-exercise-02.js"></script>
</body>
</html>
