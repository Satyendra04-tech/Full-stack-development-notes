<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment Operators</title>
  <script>
    // 1. Simple Assignment (=)
    let x = 10;
    console.log('x:', x);                                           // Output: 10

    // 2. Add and Assign (+=)
    let a = 10;
    a+=5;                                                          // Equivalent to a = a + 5
    console.log("After 'a+=5', a = :", a);                         // Output: 15

    // 3. Subtract and Assign (-=)
    let b = 12;
    b-=4;                                                         // Equivalent to b = b - 4
    console.log("After 'b-=4', b = :", b);                        // Output: 8

    // 4. Multiply and Assign (*=)
    let c = 3;
    c*=4;                                                        // Equivalent to c = c * 4
    console.log("After 'c*=4', c = :", c);                       // Output: 12

    // 5. Divide and Assign (/=)
    let d = 20;
    d/=4;                                                       // Equivalent to d = d / 4
    console.log("After 'd/=4', d = :", d)                       // Output: 5

    // 6. Modulus and Assign (%=)
    let e = 17;
    e%=5;                                                      // Equivalent to e = e % 5
    console.log("After 'e%=5', e = :", e)                      // Output: 2

    // 7. Exponentiation and Assign (**=)
    let f = 4;
    f**=3;                                                     // Equivalent to f = f ** 3
    console.log("After 'f**=3', f = :", f)                     // Output: 64

  </script>
</head>
<body>
  
</body>
</html>
