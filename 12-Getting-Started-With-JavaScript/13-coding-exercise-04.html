<!-- 
Complete the following tasks using the appropriate JavaScript comparison operators. Assign each result to a designated variable:
        - Equal (==): Compare two values 5 and "5" and assign the result to a variable named isEqual.
        - Strict Equal (===): Compare two values 5 and "5" and assign the result to a variable named isStrictEqual.
        - Not Equal (!=): Compare two values 5 and "5" and assign the result to a variable named isNotEqual.
        - Strict Not Equal (!==): Compare two values 5 and "5" and assign the result to a variable named isStrictNotEqual.
        - Greater Than (>): Compare two values 10 and 8 and assign the result to a variable named isGreaterThan.
        - Greater Than or Equal (>=): Compare two values 10 and 10 and assign the result to a variable named isGreaterThanOrEqual. 
-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparison Operators Exercise</title>
    <script>

let isEqual = 5=="5";

let isStrictEqual = 5==="5";

let isNotEqual = 5!="5";

let isStrictNotEqual = 5!=="5";

let isGreaterThan = 10>8;

let isGreaterThanOrEqual = 10>=10;

    </script>
</head>
<body>
    <h1>Comparison Operators Exercise</h1>
    <div>
        <p>Equal (==): <span id="outputIsEqual"></span></p>
        <p>Strict Equal (===): <span id="outputIsStrictEqual"></span></p>
        <p>Not Equal (!=): <span id="outputIsNotEqual"></span></p>
        <p>Strict Not Equal (!==): <span id="outputIsStrictNotEqual"></span></p>
        <p>Greater Than (>): <span id="outputIsGreaterThan"></span></p>
        <p>Greater Than or Equal (>=): <span id="outputIsGreaterThanOrEqual"></span></p>
    </div>
    <script src="./coding-exercise-04.js"></script>
</body>
</html>
