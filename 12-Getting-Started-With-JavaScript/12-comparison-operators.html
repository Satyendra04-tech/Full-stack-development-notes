<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparison Operators</title>
  <script>
     // 1. Equal (==)
     let num1 = 10;
     let str1 = "10";
     console.log("is num1 == str1:", num1==str1);                       // Output: true (compares value, not type)


    // 2. Strict Equal (===)
    let num2 = 10;
    let str2 = "10";
     console.log("is num2 === str2:", num1===str1);                   // Output: false (compares value and type)


     // 3. Not Equal (!=)
     let num3 = 23;
     let str3 = "23";
     console.log("is num3 != str3:", num3!=str3);                    // Output: false (compares value, not type)


     // 4. Strict Not Equal (!==)
     let num4 = 23;
     let str4 = "23";
     console.log("is num4 !== str4:", num4!==str4);                 // Output: true (compares value and type)


     // 5. Greater Than (>)
     let age1 = 25;
     let age2 = 18;
     console.log("is age1 > age2:", age1>age2);                    // Output: true


     // 6. Greater Than or Equal (>=)
     let score1 = 80;
     let score2 = 80;
     console.log("is score1 >= score2:", score1>=score2);           // Output: true


     // 7. Less Than (<)
     let age3 = 15;
     let age4 = 30;
     console.log("is age3 < age4:", age3<age4);                    // Output: true


     // 8. Less Than or Equal (<=)
     let score3 = 50;
     let score4 = 100;
     console.log("is score3 <= score4:", score3<=score4);                     // Output: true


     // 9. Compare different data types
     console.log("Compare number and string:", 100 == "100");                     // Output: true
     console.log("Strict Compare number and string:", 100 === "100");             // Output: false


     // 10. Compare booleans
     let isTrue = true;
     let isFalse = false;
     console.log("Boolean comparison (true == 1):", isTrue == 1);                 // Output: true
     console.log("Boolean comparison (false == 0):", isFalse == 0);               // Output: true

  </script>
</head>
<body>
  
</body>
</html>
