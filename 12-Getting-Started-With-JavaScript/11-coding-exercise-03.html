<!-- 
Complete the following tasks using the appropriate JavaScript assignment operators in the index.js file:
        - Add and Assign (+=): Add 5 to a variable named a and assign the result to the same variable.
        - Subtract and Assign (-=): Subtract 5 from a variable named b and assign the result to the same variable.
        - Multiply and Assign (*=): Multiply a variable named c by 2 and assign the result to the same variable.
        - Divide and Assign (/=): Divide a variable named d by 2 and assign the result to the same variable.
        - Modulus and Assign (%=): Apply modulus between a variable named e and 4 and assign the result to the same variable.
        - Exponentiation and Assign (=)**: Raise a variable named f to the power of 3 and assign the result to the same variable. 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Operators Exercise</title>
    <script>
let a = 10;
a+=5;

let b = 20;
b-=5;

let c = 30;
c*=2;

let d = 40;
d/=2;

let e = 50;
e%=4;

let f = 2;
f**=3;
    </script>
</head>
<body>
    <h1>Assignment Operators Exercise</h1>
    <div>
        <p>Add and Assign (+=): <span id="outputAddAssign"></span></p>
        <p>Subtract and Assign (-=): <span id="outputSubtractAssign"></span></p>
        <p>Multiply and Assign (*=): <span id="outputMultiplyAssign"></span></p>
        <p>Divide and Assign (/=): <span id="outputDivideAssign"></span></p>
        <p>Modulus and Assign (%=): <span id="outputModulusAssign"></span></p>
        <p>Exponentiation and Assign (**=): <span id="outputExponentiationAssign"></span></p>
    </div>
    <script src="./coding-exercise-03.js"></script>
</body>
</html>
