<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arithmetic Operators</title>
  <script>
    // 1. Addition (+) 
    let sum = 5+6;
    console.log('sum of 5 and 6:', sum);                              // Output: 11

    // 2. Subtraction (-)
    let difference = 6-5;
    console.log('difference of 6 and 5:', difference);                // Output: 1

    // 3. Multiplication (*)
    let product = 6*5;
    console.log('product of 6 and 5:', product)                       // Output: 30

    // 4. Division (/)
    let quotient = 20 / 5;
    console.log("20 / 5 =", quotient);                                // Output: 4

    // 5. Modulus (%)
    let num1 = 21;
    let num2 = 5;
    let remainder = 21 % 5;
    console.log(`${num1} % ${num2} =`, remainder);                     // Output: 1

     // 6. Exponentiation (**)
     let base = 2;
     let exponent = 3;
     let power = base ** exponent;
     console.log(`${base} ** ${exponent} =`, power);                   // Output: 8

     // 7. Increment (++)
     let incrementValue = 5;
     incrementValue++;                                                // Increases the value by 1
     console.log("Increment 5 by 1 =", incrementValue);               // Output: 6

     // 8. Decrement (--)
     let decrementValue = 5;
    decrementValue--;                                                // Decreases the value by 1
    console.log("Decrement 5 by 1 =", decrementValue);              // Output: 4

  </script>
</head>
<body>
  
</body>
</html>
