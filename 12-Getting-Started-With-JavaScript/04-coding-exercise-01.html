<!-- 
1. Objective: Understand and use different types of variables (var, let) and work with primitive data types 
   (string, number, and boolean).

2. Instructions (to be included in index.html as a guide):
        - Task 1: Declare a var named age and assign it a number.
        - Task 2: Declare a let named userName and assign it a string.
        - Task 3: Declare a let named isStudent and assign it a boolean value. 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Variables Exercise</title>
</head>
<body>
    <h1>JavaScript Variables Exercise</h1>
        <div>
        <p>Age: <span id="outputAge"></span></p>
        <p>User Name: <span id="outputUserName"></span></p>
        <p>Is Student: <span id="outputIsStudent"></span></p>
    </div>

    <script >
      var age = 27;
      console.log(age);

      let userName = "Satyendra Jha";
      console.log(userName);

      let isStudent = true;
      console.log(isStudent);
    </script>
    
</body>
</html>
