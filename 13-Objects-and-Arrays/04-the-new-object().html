<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Object constructor</title>
  <script>
    
// Creating a car object using the new Object constructor
let audi = new Object();
audi.brand = "Audi";
audi.model = "A7";
audi.color = "Black";
audi.make = 2024;
audi ["car owner"] = "Satyendra";

console.log(audi);
console.log("Car Model: ", audi.brand);
console.log("Owner: ", audi["car owner"]);

  </script>
</head>

</body>
