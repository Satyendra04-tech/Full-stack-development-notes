<!-- 
Create a clone of the given object using the spread operator, ensuring the new object does not reference the original. 
Modify a property in the cloned object to demonstrate that changes do not affect the original object:
        - Clone the Object: Clone the provided originalObject using the spread operator and assign it to a variable named 
          clonedObject.

        - Modify the Cloned Object: Change the age property of clonedObject to 35.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutability and Spread Operator Exercise</title>
    <script>
// Original object
const originalObject = {
    name: "John Doe",
    age: 30
};


let clonedObject = { ...originalObject };
clonedObject.age = 35;

    </script>
</head>
<body>
    <h1>Mutability and Spread Operator Exercise</h1>
    <div>
        <p>Original Age: <span id="outputOriginalAge"></span></p>
        <p>Cloned Age: <span id="outputClonedAge"></span></p>
    </div>
    <script src="./coding-exercise-02.js"></script>  
</body>
</html>
