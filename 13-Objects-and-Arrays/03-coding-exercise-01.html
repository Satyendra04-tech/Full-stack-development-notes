<!-- 
Create an object named userInfo in the index.js file. Assign the following properties with specified primitive type values:
        - name: Assign a string value "John Doe".
        - age: Assign an integer value 30.
        - isSubscriber: Assign a boolean value true.
        - accountBalance: Assign a floating-point number 100.50.
        - userId: Assign a string value that represents a numeric identifier "12345".
        - Ensure that each property is correctly assigned with the specified value type. 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Creation Exercise</title>
    <script>

    let userInfo = {
    name: "John Doe",
    age: 30,
    isSubscriber: true,
    accountBalance: 100.50,
    userId: "12345",
};

    </script>
</head>
<body>
    <h1>Object Creation Exercise</h1>
    <div>
        <p>Name: <span id="outputName"></span></p>
        <p>Age: <span id="outputAge"></span></p>
        <p>Is Subscriber: <span id="outputIsSubscriber"></span></p>
        <p>Account Balance: <span id="outputAccountBalance"></span></p>
        <p>User ID: <span id="outputUserId"></span></p>
    </div>
    <script src="./coding-exercise-01.js"></script>
</body>
</html>
