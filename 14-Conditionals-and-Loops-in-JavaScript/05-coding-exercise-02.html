<!-- 
Create a variable dayNumber and assign it a numeric value corresponding to a day of the week (1-7). 
Using a switch statement, determine the day of the week and store it in a variable named dayName. Display the result:
        - 1 should map to "Monday".
        - 2 should map to "Tuesday".
        - 3 should map to "Wednesday".
        - 4 should map to "Thursday".
        - 5 should map to "Friday".
        - 6 should map to "Saturday".
        - 7 should map to "Sunday".
        - Any other number should default to "Invalid day". 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Statements Exercise</title>
    <script>
      let dayNumber = 3;
      let dayName;

switch(dayNumber){
    case 1:
        dayName = "Monday";
        break;
    
    case 2:
        dayName = "Tuesday";
        break;
        
    case 3:
        dayName = "Wednesday";
        break;
        
    case 4:
        dayName = "Thursday";
        break;
        
    case 5:
        dayName = "Friday";
        break;
        
    case 6:
        dayName = "Saturday";
        break;
        
    case 7:
        dayName = "Sunday";
        break;
    
    default :
        dayName = "Invalid day";
    
}
    </script>
</head>
<body>
    <h1>Switch Statements Exercise</h1>
    <div>
        <p>Day of the Week: <span id="outputDayName"></span></p>
    </div>


    <script>

      /* just to show the output in the browser */
      function displayValue(id, value) {
    try {
        document.getElementById(id).textContent = value;
    } catch (e) {
        console.error("Error displaying value for " + id + ": " + e.message);
    }
}

// Display the day of the week
displayValue('outputDayName', dayName);

    </script>
</body>
</html>
