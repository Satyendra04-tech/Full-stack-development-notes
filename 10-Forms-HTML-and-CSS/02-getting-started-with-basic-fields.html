<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Styled Form</title>
    <link href="./style.css" rel="stylesheet" />
  </head>
  <body>
    <h2>Forms with HTML and CSS</h2>

    <form>
      <div class="form-container">

        <!-- First Name -->
        <div class="form-column">
          <label for="fname"> First Name</label>
          <input id="fname" type="text" name="firstname" placeholder="Your first name..." required  />

        <!-- Email -->
          <label for="email">Email</label>
          <input id="email" type="email" name="email" placeholder="Your email.." />


        <!-- Phone -->
           <label for="Phone">Phone Number</label>
           <input id="Phone" type="tel" name="phonenumber" placeholder="Your phone number.."  
           pattern="[0-9]{3}-[0-9]{3}-[0-9]{3}-[0-9]{1}" required/>


         <!-- Number Input -->
          <label for="age">Age</label>
          <input type="number" id="age" name="age" placeholder="Your age.." />


          <!-- Date Input -->
         <label for="dob">Date of Birth</label>
         <input type="date" id="dob" name="dob" />


         <!-- Month Input -->
         <label for="month">Month of Birth</label>
         <input type="month" id="month" name="month" />


         <!-- Time Input -->
          <label for="time">Preferred Time</label>
          <input type="time" id="time" name="time" />
        </div>


        
        <div class="form-column">
          <!-- Last Name -->
          <label for="lname">Last Name</label>
          <input id="lname" type="text" name="lastname" placeholder="Your last name..."/>


         <!-- Password -->
          <label for="password">Password</label>
          <input id="password" type="password" name="password" placeholder="Your password.." />

          
         <!-- Website -->
          <label for="web">Website</label>
          <input id="web" type="url" name="website" placeholder="Your website.." />


          <!-- Country Select -->
           <label for="country">Country</label>
           <select id="country" name="country">
            <option value="australia">Australia</option>
            <option value="canada">Canada</option>
            <option value="usa">USA</option>
            <option value="india">India</option>
            <option value="israel">Israel</option>
           </select>
        </div>
      </div>

      <!-- Submit Button -->
      <div>
        <button type="submit">Submit</button>
      </div>
    </form>
  </body>
</html>
